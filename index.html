<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Translator Bahasa Mesin</title>
<style>
:root{--bg:#090b13;--glass:rgba(22,26,44,.66);--bd:rgba(255,255,255,.09);--text:#eef0fb;--mut:#9aa3c4;--in:rgba(6,8,18,.6);--a:#6d7cff;--b:#c05cff;--c:#22d3ee;--err:#ff6b6b;--fade:rgba(9,11,19,.14)}
@media(prefers-color-scheme:light){:root{--bg:#eef0fb;--glass:rgba(255,255,255,.74);--bd:rgba(60,70,140,.16);--text:#191d33;--mut:#66709a;--in:rgba(255,255,255,.85);--a:#5461f0;--b:#a63fe8;--c:#0891b2;--err:#d6336c;--fade:rgba(238,240,251,.16)}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text);background:var(--bg);overflow-x:hidden}
#rain{position:fixed;inset:0;z-index:0;opacity:.28;pointer-events:none}
.blob{position:fixed;width:520px;height:520px;border-radius:50%;filter:blur(110px);opacity:.28;z-index:0;pointer-events:none;animation:fl 14s ease-in-out infinite alternate}
.b1{background:var(--a);top:-160px;left:-120px}.b2{background:var(--b);bottom:-180px;right:-120px;animation-delay:-6s}
@keyframes fl{to{transform:translate(70px,50px) scale(1.15)}}
.wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:38px 16px 70px}
.hero{text-align:center;margin-bottom:26px}
.logo{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:20px;font:800 22px ui-monospace,Consolas,monospace;color:#fff;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 0 40px rgba(130,110,255,.55);animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 62px rgba(192,92,255,.8);transform:translateY(-3px)}}
h1{margin:14px 0 6px;font-size:clamp(28px,5vw,46px);letter-spacing:-.02em;background:linear-gradient(90deg,var(--a),var(--b),var(--c),var(--a));background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 7s linear infinite}
@keyframes sh{to{background-position:250% 0}}
.sub{margin:0;color:var(--mut)}
.presets{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:20px 0 6px}
.pre{border:1px solid var(--bd);background:var(--glass);color:var(--text);padding:7px 14px;border-radius:999px;font-size:13px;cursor:pointer;backdrop-filter:blur(10px);transition:.2s}
.pre:hover{border-color:var(--c);color:var(--c);transform:translateY(-2px)}
.flow{text-align:center;margin:16px 0 18px}
.flow span{display:inline-block;padding:8px 20px;border-radius:999px;font-weight:600;background:linear-gradient(135deg,rgba(109,124,255,.2),rgba(192,92,255,.2));border:1px solid var(--bd)}
.grid{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center}
.panel{position:relative;align-self:stretch;padding:20px;border-radius:22px;background:var(--glass);border:1px solid var(--bd);backdrop-filter:blur(18px);box-shadow:0 20px 50px rgba(0,0,0,.25);transition:.25s}
.panel:hover{box-shadow:0 20px 60px rgba(109,124,255,.25);border-color:rgba(130,140,255,.4)}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.18em;padding:4px 12px;border-radius:999px;color:#fff;background:linear-gradient(90deg,var(--a),var(--b))}
.tag.k{background:linear-gradient(90deg,var(--c),var(--a))}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.chip{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:14px;border:1px solid var(--bd);background:var(--in);color:var(--text);cursor:pointer;font-size:14px;font-weight:600;transition:.2s}
.chip i{font-style:normal;font-size:20px}.chip small{font-weight:400;font-size:10px;color:var(--mut)}
.chip:hover{transform:translateY(-3px);border-color:var(--a)}
.chip.on{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 8px 22px rgba(130,100,255,.45);transform:translateY(-2px)}
.chip.on small{color:rgba(255,255,255,.82)}
textarea,.out{display:block;width:100%;min-height:150px;padding:14px;border-radius:14px;border:1px solid var(--bd);background:var(--in);color:var(--text);font:15px/1.6 ui-monospace,Consolas,monospace;resize:vertical;outline:0;transition:.2s}
textarea:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(109,124,255,.25)}
.out{white-space:pre-wrap;word-break:break-all;overflow:auto;max-height:320px;animation:in .3s;box-shadow:inset 0 0 30px rgba(34,211,238,.06)}
.out.empty{color:var(--mut)}.out.err{color:var(--err);font-family:inherit}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.row{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--bd);background:transparent;color:var(--text);padding:8px 15px;border-radius:11px;cursor:pointer;font-size:13px;transition:.2s}
.btn:hover{border-color:var(--c);color:var(--c)}
.btn.pri{border:0;color:#fff;background:linear-gradient(90deg,var(--a),var(--b))}.btn.pri:hover{color:#fff;filter:brightness(1.15)}
.info{margin-left:auto;font-size:12px;color:var(--mut)}
.swap{width:60px;height:60px;border-radius:50%;border:0;color:#fff;font-size:26px;cursor:pointer;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 0 0 6px rgba(130,110,255,.15),0 10px 30px rgba(130,100,255,.5);transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.swap:hover{filter:brightness(1.15)}.swap.spin{transform:rotate(180deg)}
.det{margin-top:26px}.det h2{font-size:18px;margin:0 0 14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
.tile{padding:12px;border-radius:16px;background:var(--glass);border:1px solid var(--bd);backdrop-filter:blur(10px);opacity:0;animation:pop .45s forwards;transition:.2s}
.tile:hover{transform:translateY(-4px) scale(1.03);border-color:var(--c);box-shadow:0 12px 28px rgba(34,211,238,.2)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.9)}to{opacity:1}}
.no{font-size:10px;color:var(--mut)}
.ch{font:800 28px ui-monospace,Consolas,monospace;text-align:center;margin:2px 0 8px;padding:6px 0;border-radius:10px;background:var(--in)}
.ch.hl{background:linear-gradient(135deg,var(--a),var(--b));color:#fff}
.ch.sm{font-size:15px;padding:13px 0}
.ln{display:flex;justify-content:space-between;font:12px ui-monospace,Consolas,monospace;padding:3px 6px;border-radius:7px;color:var(--mut)}
.ln b{font-weight:600;color:var(--text)}
.ln.hl{background:rgba(34,211,238,.16)}.ln.hl b{color:var(--c)}
.hidden{display:none}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,40px);opacity:0;z-index:5;padding:10px 20px;border-radius:999px;color:#fff;font-size:14px;background:linear-gradient(90deg,var(--a),var(--b));transition:.3s}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:780px){.grid{grid-template-columns:1fr}.swap{justify-self:center;transform:rotate(90deg)}.swap.spin{transform:rotate(270deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.tile{opacity:1}}
</style></head><body>
<canvas id="rain"></canvas><div class="blob b1"></div><div class="blob b2"></div>
<div class="wrap">
<div class="hero"><div class="logo">01</div><h1>Translator Bahasa Mesin</h1>
<p class="sub">Terjemahkan antara teks, ASCII, biner, oktal, desimal, dan heksadesimal.</p>
<div class="presets" id="pre"></div></div>
<div class="flow"><span id="flow"></span></div>
<div class="grid">
  <section class="panel"><span class="tag">DARI</span><div class="chips" id="cs"></div>
    <textarea id="in" spellcheck="false"></textarea>
    <div class="row"><button class="btn" id="ex">✨ Contoh</button><button class="btn" id="clr">🗑 Hapus</button></div></section>
  <button class="swap" id="sw" title="Tukar arah">⇄</button>
  <section class="panel"><span class="tag k">KE</span><div class="chips" id="cd"></div>
    <div class="out empty" id="out">Hasil akan tampil di sini</div>
    <div class="row"><button class="btn pri" id="cp">📋 Salin hasil</button><span class="info" id="info"></span></div></section>
</div>
<div class="det hidden" id="det"><h2>🔍 Rincian per huruf</h2><div class="tiles" id="tiles"></div></div>
</div><div id="toast"></div>
<script>
const KONTROL={0:"NUL",7:"BEL",8:"BS",9:"TAB",10:"LF",13:"CR",27:"ESC",32:"SPASI",127:"DEL"};
const BASIS={biner:[2,8],oktal:[8,0],desimal:[10,0],hex:[16,2]},PREFIX={biner:"0b",oktal:"0o",hex:"0x"};
const VALID={biner:/^[01]+$/,oktal:/^[0-7]+$/,desimal:/^[0-9]+$/,hex:/^[0-9a-f]+$/};
function keByte(fmt,data){
  if(fmt==="teks")return new TextEncoder().encode(data);
  if(fmt==="ascii"){for(const ch of data)if(ch.codePointAt(0)>127)throw new Error("Karakter "+ch+" bukan ASCII (0-127)");return new TextEncoder().encode(data)}
  const [basis,grup]=BASIS[fmt];let t=data.toLowerCase().replace(/,/g," ").split(/\s+/).filter(Boolean);
  if(PREFIX[fmt])t=t.map(x=>x.startsWith(PREFIX[fmt])?x.slice(2):x);
  if(grup&&t.length===1&&t[0].length>grup){const s=t[0];
    if(s.length%grup)throw new Error("Tanpa spasi, panjang kode harus kelipatan "+grup+" digit");
    t=s.match(new RegExp(".{"+grup+"}","g"))}
  return Uint8Array.from(t.map(x=>{
    if(!VALID[fmt].test(x))throw new Error(x+" tidak valid untuk format "+fmt);
    const n=parseInt(x,basis);if(n>255)throw new Error("Nilai "+n+" di luar jangkauan byte (0-255)");return n}))}
function dariByte(fmt,raw){
  const p=(b,r,w)=>b.toString(r).padStart(w,"0");
  if(fmt==="biner")return Array.from(raw,b=>p(b,2,8)).join(" ");
  if(fmt==="oktal")return Array.from(raw,b=>p(b,8,3)).join(" ");
  if(fmt==="desimal")return Array.from(raw).join(" ");
  if(fmt==="hex")return Array.from(raw,b=>p(b,16,2).toUpperCase()).join(" ");
  if(fmt==="teks")return new TextDecoder("utf-8").decode(raw);
  if(raw.some(b=>b>127))throw new Error("Ada byte di atas 127, bukan ASCII");
  return Array.from(raw,b=>(b<32||b===127)?"["+(KONTROL[b]??b)+"]":String.fromCharCode(b)).join("")}
function baris(raw){
  const rows=[];let i=0,k=0,jml=0;
  while(i<raw.length){
    const b=raw[i];let n=b<192?1:b<224?2:b<240?3:4,ch=null;
    try{ch=new TextDecoder("utf-8",{fatal:true}).decode(raw.slice(i,i+n))}catch(e){n=1}
    jml++;
    raw.slice(i,i+n).forEach((x,j)=>{
      let h;
      if(ch===null)h="?";else if(j)h="·";else if(x in KONTROL)h=KONTROL[x];
      else h=/[\p{C}\p{Z}]/u.test(ch)?"?":ch;
      k++;rows.push({no:k,huruf:h,desimal:x,biner:x.toString(2).padStart(8,"0"),oktal:x.toString(8).padStart(3,"0"),hex:x.toString(16).toUpperCase().padStart(2,"0")})});
    i+=n}
  return [rows,jml]}
function proses(src,dst,data){
  try{const raw=keByte(src,data),out=dariByte(dst,raw),[rows,jml]=baris(raw);
    return {output:out,teks:new TextDecoder("utf-8").decode(raw),rows,karakter:jml,byte:raw.length}}
  catch(e){return {error:e.message}}}
const F=[["teks","🗣️","Teks","manusia"],["ascii","🔤","ASCII","0–127"],["biner","💡","Biner","basis 2"],["oktal","🔢","Oktal","basis 8"],["desimal","🔟","Desimal","basis 10"],["hex","🧬","Hex","basis 16"]];
const EX={teks:"Halo Saif",ascii:"Hello",biner:"01001000 01100101 01101100 01101100 01101111",oktal:"110 145 154 154 157",desimal:"72 101 108 108 111",hex:"48 65 6C 6C 6F"};
const COL={teks:["huruf"],ascii:["huruf","desimal"],biner:["biner"],oktal:["oktal"],desimal:["desimal"],hex:["hex"]};
const PRE=[["teks","hex"],["hex","ascii"],["oktal","biner"],["biner","teks"],["teks","biner"],["desimal","hex"]];
const $=i=>document.getElementById(i),nm=id=>F.find(f=>f[0]===id);
let src="teks",dst="hex",last=null,seq=0,timer;

function chips(box,get,set){box.innerHTML="";F.forEach(([id,ic,n,s])=>{const b=document.createElement("button");
  b.className="chip"+(get()===id?" on":"");b.innerHTML="<i>"+ic+"</i>"+n+"<small>"+s+"</small>";
  b.onclick=()=>{set(id);draw();run()};box.appendChild(b)})}
function draw(){chips($("cs"),()=>src,v=>src=v);chips($("cd"),()=>dst,v=>dst=v);
  $("in").placeholder="Ketik atau tempel "+nm(src)[2]+" di sini...";
  $("flow").textContent=nm(src)[1]+" "+nm(src)[2]+"  →  "+nm(dst)[1]+" "+nm(dst)[2]}
PRE.forEach(([a,b])=>{const p=document.createElement("button");p.className="pre";p.textContent=nm(a)[2]+" → "+nm(b)[2];
  p.onclick=()=>{src=a;dst=b;$("in").value=EX[a];draw();run()};$("pre").appendChild(p)});
function show(t,c){const o=$("out");o.textContent=t;o.className="out "+(c||"")}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1500)}

async function run(){
  const data=$("in").value,my=++seq;
  if(!data.trim()){show("Hasil akan tampil di sini","empty");$("det").classList.add("hidden");$("info").textContent="";last=null;return}
  const r=proses(src,dst,data);
  if(my!==seq)return;
  if(r.error){show("⚠ "+r.error,"err");$("det").classList.add("hidden");$("info").textContent="";last=null;return}
  last=r;show(r.output);$("info").textContent=r.karakter+" karakter · "+r.byte+" byte";
  const hl=k=>COL[src].includes(k)||COL[dst].includes(k),t=$("tiles");t.innerHTML="";
  r.rows.forEach((x,i)=>{const d=document.createElement("div");d.className="tile";d.style.animationDelay=Math.min(i*30,600)+"ms";
    const n=document.createElement("div");n.className="no";n.textContent="#"+x.no;
    const c=document.createElement("div");c.className="ch"+(hl("huruf")?" hl":"")+(x.huruf.length>1?" sm":"");c.textContent=x.huruf;
    d.append(n,c);
    [["desimal","DEC"],["biner","BIN"],["oktal","OKT"],["hex","HEX"]].forEach(([k,l])=>{
      const ln=document.createElement("div");ln.className="ln"+(hl(k)?" hl":"");
      const s=document.createElement("span");s.textContent=l;const b=document.createElement("b");b.textContent=x[k];
      ln.append(s,b);d.appendChild(ln)});
    t.appendChild(d)});
  $("det").classList.remove("hidden");
}
$("in").oninput=()=>{clearTimeout(timer);timer=setTimeout(run,150)};
$("sw").onclick=()=>{$("sw").classList.toggle("spin");
  const v=last?((dst==="teks"||dst==="ascii")?last.teks:last.output):$("in").value;
  [src,dst]=[dst,src];$("in").value=v;draw();run()};
$("ex").onclick=()=>{$("in").value=EX[src];run()};
$("clr").onclick=()=>{$("in").value="";run()};
$("cp").onclick=()=>{if(last){navigator.clipboard.writeText(last.output);toast("Hasil tersalin ✓")}else toast("Belum ada hasil")};

const cv=$("rain"),cx=cv.getContext("2d");let dr=[];
function rs(){cv.width=innerWidth;cv.height=innerHeight;dr=Array.from({length:Math.floor(cv.width/20)},()=>Math.random()*50)}
function rain(){const s=getComputedStyle(document.documentElement);cx.fillStyle=s.getPropertyValue("--fade");cx.fillRect(0,0,cv.width,cv.height);
  cx.fillStyle=s.getPropertyValue("--c");cx.font="15px monospace";
  dr.forEach((y,i)=>{cx.fillText(Math.random()>.5?"1":"0",i*20,y*20);dr[i]=y*20>cv.height&&Math.random()>.97?0:y+1})}
rs();addEventListener("resize",rs);
if(!matchMedia("(prefers-reduced-motion:reduce)").matches)setInterval(rain,80);
draw();
</script></body></html>
